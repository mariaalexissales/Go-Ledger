services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: go_ledger_db
    ports:
      - "5432:5432"
    volumes:
      # Postgres stores its cluster in /var/lib/postgresql/data. Mounting the
      # parent directory left the data outside the volume, so nothing persisted.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_ledger_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/go_ledger_db?sslmode=disable
      PORT: "8080"
      # Same-origin in this mode: the Go binary serves the console itself, so
      # no CORS headers are needed at all.
      CORS_ALLOWED_ORIGINS: ""
      SEED_ON_START: "true"
      DEMOS_ENABLED: "true"
      OPS_ENABLED: "true"
      CLIENT_IP_MODE: xff-trust-all
      RATE_LIMIT: "30"
      RATE_WINDOW: 10s
      RATE_BLOCK_PERIOD: 30s
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
