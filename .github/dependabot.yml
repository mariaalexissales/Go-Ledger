version: 2

updates:
  - package-ecosystem: gomod
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
