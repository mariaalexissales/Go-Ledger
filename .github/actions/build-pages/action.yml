name: Build Pages bundle
description: >-
  Builds the static replay console from web/public/replay and uploads it as a
  GitHub Pages artifact. Shared by the deploy workflow and the recording
  workflow so the published bundle is produced exactly one way.

runs:
  using: composite
  steps:
    - name: Fail early if the fixtures are missing
      shell: bash
      run: test -f web/public/replay/index.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: web
      run: npm ci

    - name: Build the static console
      shell: bash
      working-directory: web
      run: npm run build:pages

    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: web/dist-pages
