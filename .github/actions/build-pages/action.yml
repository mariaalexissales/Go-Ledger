name: Build Pages bundle
description: >-
  Builds the static replay console from web/public/replay and uploads it as a
  GitHub Pages artifact. Shared by the deploy workflow and the recording
  workflow so the published bundle is produced exactly one way.

runs:
  using: composite
  steps:
    - name: Fail early if the fixtures are missing
      shell: bash
      run: test -f web/public/replay/index.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: web
      run: npm ci

    - name: Build the static console
      shell: bash
      working-directory: web
      run: npm run build:pages

    - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

    - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      with:
        path: web/dist-pages
