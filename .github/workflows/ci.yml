name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: go_ledger_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d go_ledger_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gofmt -l prints offending files but exits 0, so test -z supplies the
      # failure. Do not simplify this to a bare `gofmt -l`.
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Test
        env:
          GO_LEDGER_TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/go_ledger_db?sslmode=disable
        run: |
          set -o pipefail
          go test ./... -race -v 2>&1 | tee test.log
          # A skipped database test still passes; fail instead.
          ! grep -E '^--- SKIP: Test(Recorder|ListEvents|Stream)' test.log

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Typecheck does not catch a Vite-only failure. Without this the first
      # sign of a broken bundle is the Pages deploy, after the merge.
      - name: Build
        run: npm run build
