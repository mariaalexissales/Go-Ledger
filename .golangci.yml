version: "2"

linters:
  default: none
  enable:
    - errcheck # discarded error returns
    - govet
    - ineffassign # values assigned and never read
    - misspell
    - staticcheck # includes the old gosimple and stylecheck
    - unused

  settings:
    errcheck:
      # Deferred cleanup where the error carries no information. A write-side
      # Close reports flush failures and must still be checked.
      exclude-functions:
        # Both spellings: errcheck matches the declared type, and spa.go holds
        # an fs.File rather than a bare io.Closer.
        - (io.Closer).Close
        - (io/fs.File).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/golang-migrate/migrate/v4.Migrate).Close

    staticcheck:
      checks:
        - all
        - -ST1000

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
